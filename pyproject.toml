[project]
name = "priorreview"
version = "0.1.0"
description = "Multi-agent scientific peer review with historical review priors"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.5.2,<0.6.0",
    "httpx>=0.28.1",
    "langchain>=1.2.13",
    "langchain-core>=1.2.22",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.3",
    "openai>=1.0.0",
    "psycopg[binary]>=3.2.9",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "sqlglot>=30.1.0",
]

[tool.uv]
package = false
